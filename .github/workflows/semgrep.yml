name: Static code analysis (SAST)

# Runs Semgrep static analysis over the codebase and publishes a SARIF report artifact
# (report-only: findings do not fail the build).
#
# Uses Semgrep's community rules via '--config auto', which run without a login token, so the
# scan works on fork-based pull requests. SEMGREP_APP_TOKEN is optional: when the secret is
# present it enriches the rule set; when absent (e.g. fork PRs) the env is simply empty.
#
# Mode: report-only. The scan surfaces findings for triage in the 'semgrep-sarif' artifact but
# does not block the build. Once the known backlog is triaged the gate can be tightened later
# by removing the '|| true' so findings fail the build.

on: [pull_request]

jobs:
  semgrep:
    name: run-semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan (report-only)
        run: semgrep scan --config auto --sarif --output semgrep.sarif || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
